<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FDF2F1">
<title>도감</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23E2798F'/></svg>">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg,#FDF2F1);color:var(--ink,#4A3238);font-family:var(--font);
 min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
 transition:background .25s ease,color .25s ease}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{padding:16px 14px calc(90px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}

.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.title{flex:1;min-width:0;background:none;border:none;font-family:inherit;font-size:23px;font-weight:700;
 letter-spacing:-.02em;color:var(--ink);padding:2px 0}
.title:focus{outline:none;border-bottom:1px solid var(--line)}
.icon{width:38px;height:38px;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);
 border-radius:50%;font-size:16px;line-height:1;display:grid;place-items:center}

.palette{display:flex;align-items:center;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.pdot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0;
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pdot.on{border-color:var(--card);box-shadow:0 0 0 2px var(--ink)}
.pname{font-size:12px;color:var(--ink2);margin-left:2px}

.tools{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--ink);
 border-radius:var(--rs);padding:10px 12px;font-size:16px;font-family:inherit}
.search::placeholder{color:var(--ink2)}
.sel{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:var(--rs);
 padding:10px 8px;font-size:13px;font-family:inherit}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:999px;
 padding:6px 12px;font-size:12.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}

.card{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;
 background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
 transition:transform .16s ease}
.card:active{transform:scale(.982)}
.spine{position:absolute;left:0;top:0;bottom:0;width:4px;z-index:2}
.thumb{position:relative;display:block;aspect-ratio:3/4;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{width:100%;height:100%;display:grid;place-items:center;font-size:44px;font-weight:700}
.scrim{position:absolute;inset:auto 0 0 0;height:58%;
 background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0))}
.cname{position:absolute;left:11px;right:10px;bottom:8px;color:#fff;font-size:15px;font-weight:700;
 letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.cmeta{display:block;padding:9px 11px 11px}
.cworld{display:block;font-size:11.5px;font-weight:600;margin-bottom:3px}
.csum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
 font-size:12.5px;line-height:1.45;color:var(--ink2)}

.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;
 border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:27px;line-height:1;
 box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:20}
.count{text-align:center;font-size:11.5px;color:var(--ink2);margin:22px 0 0}

.empty{text-align:center;padding:56px 16px}
.e1{font-size:16px;font-weight:600;margin:0 0 6px}
.e2{font-size:13.5px;color:var(--ink2);margin:0}
.cta{margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:999px;
 padding:12px 22px;font-size:14px;font-weight:600}

.detail{max-width:680px;margin:0 auto;animation:rise .2s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.detail{animation:none}.card{transition:none}}
.dbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dbtns{display:flex;gap:8px;align-items:center}
.ghost{background:none;border:1px solid var(--line);color:var(--ink2);border-radius:999px;
 padding:7px 14px;font-size:13px}
.ghost.small{margin-top:8px;font-size:12px;padding:5px 12px}
.save{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:8px 18px;
 font-size:13.5px;font-weight:600}
.save[disabled]{opacity:.55}
.save.wide{display:block;width:100%;margin:26px 0 10px;padding:14px;font-size:15px;border-radius:var(--rs)}

.hero{width:100%;max-height:72vh;object-fit:cover;display:block;border-radius:var(--r);
 box-shadow:var(--sh);border:1px solid var(--line)}
.noimg2{aspect-ratio:3/4;display:grid;place-items:center;font-size:90px;font-weight:700;border-radius:var(--r)}

.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.sthumb{position:relative;flex:none;width:62px;height:62px;padding:0;border-radius:var(--rs);
 overflow:hidden;border:1px solid var(--line);background:var(--card)}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block}
.sthumb.on{border:2px solid var(--accent)}
.gx{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;border:none;
 background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
.addmore{flex:none;width:62px;height:62px;border-radius:var(--rs);border:1px dashed var(--line);
 background:none;color:var(--ink2);font-size:20px}

.dname{font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin:20px 0 0}
.dalias{margin:7px 0 0;font-size:14px;font-weight:600;color:var(--me,var(--accent))}
.dworld{margin:12px 0 0;font-size:12.5px;color:var(--ink2)}
.dsum{margin:14px 0 0;font-size:15px;line-height:1.65;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{background:var(--soft);color:var(--ink2);border-radius:999px;padding:5px 11px;font-size:12px}

.sheetlist{margin:22px 0 0;border-top:1px solid var(--line)}
.frow{display:flex;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line)}
.frow dt{flex:none;width:88px;font-size:13px;color:var(--ink2);margin:0}
.frow dd{margin:0;font-size:14px;line-height:1.55;flex:1;min-width:0;word-break:break-word}

.body{margin-top:24px;white-space:pre-wrap;font-size:14.5px;line-height:1.85;max-width:66ch;
 background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;word-break:break-word}

.drop{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:3/4;max-height:62vh;
 border-radius:var(--r);overflow:hidden;border:1px dashed var(--line);background:var(--card);cursor:pointer}
.drop img{width:100%;height:100%;object-fit:cover}
.dropmsg{font-size:14px;color:var(--ink2)}

.fgrid{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.fl{display:block}
.flabel{display:block;font-size:12.5px;color:var(--ink2);margin:18px 0 7px}
.fl .flabel{margin:0 0 6px}
.in{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
 border-radius:var(--rs);padding:11px 12px;font-size:16px;font-family:inherit}
.in::placeholder{color:var(--ink2);opacity:.75}
.ta{width:100%;min-height:220px;background:var(--card);border:1px solid var(--line);color:var(--ink);
 border-radius:var(--r);padding:14px;font-size:16px;line-height:1.8;font-family:inherit;resize:vertical}
.ta::placeholder{color:var(--ink2);opacity:.75}

.sw{display:flex;flex-wrap:wrap;gap:9px}
.swdot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.swdot.on{border-color:var(--card);box-shadow:0 0 0 2px var(--ink)}

.frow2{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.frow2 .k{flex:0 0 96px;min-width:0}
.frow2 .v{flex:1;min-width:0}
.x{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;
 color:var(--ink2);font-size:15px;line-height:1}

.sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;
 justify-content:center;z-index:40}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;
 padding:22px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sh{margin:0 0 10px;font-size:17px;font-weight:700}
.note{font-size:13px;line-height:1.65;color:var(--ink2);margin:0 0 12px}
.row2{display:flex;gap:8px}
.btn{flex:1;background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:var(--rs);
 padding:12px;font-size:14px;font-weight:600}
.btn.danger{background:#d24b5e;border-color:#d24b5e;color:#fff}
.btn.wide{width:100%;margin-top:10px;background:none}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);
 color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;z-index:60;max-width:86vw;
 text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var SANS="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif";
var SERIF="'Nanum Myeongjo','Apple SD Gothic Neo','Batang',serif";

var THEMES={
 peach:{label:"복숭아소다",dot:"#E2798F",vars:{"--bg":"#FDF2F1","--card":"#FFFFFF","--ink":"#4A3238","--ink2":"#A08A90","--line":"#F0DEDE","--accent":"#E2798F","--soft":"#FBE7EA","--font":SANS,"--r":"20px","--rs":"12px","--sh":"0 3px 16px rgba(190,120,135,.13)"}},
 lavender:{label:"라벤더밀크",dot:"#9B87C4",vars:{"--bg":"#F5F2FB","--card":"#FFFFFF","--ink":"#3F3953","--ink2":"#948DA8","--line":"#E6E0F2","--accent":"#9B87C4","--soft":"#EFEAFA","--font":SANS,"--r":"20px","--rs":"12px","--sh":"0 3px 16px rgba(125,105,165,.13)"}},
 midnight:{label:"미드나잇",dot:"#B39DDB",vars:{"--bg":"#15131D","--card":"#201D2C","--ink":"#EAE6F3","--ink2":"#938BA9","--line":"#2F2A41","--accent":"#B39DDB","--soft":"#282237","--font":SANS,"--r":"18px","--rs":"11px","--sh":"0 4px 20px rgba(0,0,0,.45)"}},
 bookshop:{label:"고서점",dot:"#8A6A4B",vars:{"--bg":"#F1EADC","--card":"#FBF7EE","--ink":"#3D3527","--ink2":"#948667","--line":"#E0D4BC","--accent":"#8A6A4B","--soft":"#EDE2CD","--font":SERIF,"--r":"6px","--rs":"4px","--sh":"0 2px 10px rgba(120,95,60,.14)"}},
 moss:{label:"이끼정원",dot:"#6E9E82",vars:{"--bg":"#EDF2EE","--card":"#FFFFFF","--ink":"#2E3B34","--ink2":"#82908A","--line":"#DAE5DE","--accent":"#6E9E82","--soft":"#E4EEE8","--font":SANS,"--r":"16px","--rs":"10px","--sh":"0 3px 14px rgba(70,110,90,.12)"}},
 ink:{label:"먹지",dot:"#2F2F2F",vars:{"--bg":"#F4F3F0","--card":"#FFFFFF","--ink":"#222220","--ink2":"#8B8A85","--line":"#E2E1DC","--accent":"#2F2F2F","--soft":"#ECEBE6","--font":SANS,"--r":"4px","--rs":"3px","--sh":"0 1px 8px rgba(0,0,0,.08)"}}
};
var SWATCHES=["#E2798F","#C98BB9","#8E7BC4","#6E8FC9","#57A3A0","#6E9E82","#A8A055","#D4A24C","#C9795C","#A8768E","#7A8394","#4A4A4A"];
var HINTS=["나이","생일","키","성별","소속","성격","1인칭","말투","좋아하는 것","싫어하는 것","테마곡","한 마디"];

var KEY="charbook", DB="charbookdb", STORE="kv";
function openDB(){return new Promise(function(res,rej){
 var r=indexedDB.open(DB,1);
 r.onupgradeneeded=function(){r.result.createObjectStore(STORE)};
 r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};});}
function dbGet(k){return openDB().then(function(d){return new Promise(function(res,rej){
 var t=d.transaction(STORE,"readonly").objectStore(STORE).get(k);
 t.onsuccess=function(){res(t.result)};t.onerror=function(){rej(t.error)};});})
 .catch(function(){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}});}
function dbSet(k,v){return openDB().then(function(d){return new Promise(function(res,rej){
 var t=d.transaction(STORE,"readwrite").objectStore(STORE).put(v,k);
 t.onsuccess=function(){res(true)};t.onerror=function(){rej(t.error)};});})
 .catch(function(){localStorage.setItem(k,JSON.stringify(v));return true});}

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function blank(){return{id:uid(),name:"",alias:"",world:"",tags:[],color:SWATCHES[0],
 summary:"",fields:[{k:"",v:""}],body:"",image:"",gallery:[],made:Date.now()}}
function fmt(n){return n>1048576?(n/1048576).toFixed(1)+"MB":Math.round(n/1024)+"KB"}
function el(html){var t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}

function shrink(file,max,q){max=max||620;q=q||0.72;
 return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onerror=function(){rej(new Error("read"))};
  fr.onload=function(e){
   var img=new Image();
   img.onerror=function(){rej(new Error("decode"))};
   img.onload=function(){
    var s=Math.min(1,max/Math.max(img.width,img.height));
    var w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
    var c=document.createElement("canvas");c.width=w;c.height=h;
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    res(c.toDataURL("image/jpeg",q));};
   img.src=e.target.result;};
  fr.readAsDataURL(file);});}

var S=null, app=document.getElementById("app");
var q="", worldF="전체", sortBy="new";

function applyTheme(){
 var t=THEMES[S.theme]||THEMES.peach;
 for(var k in t.vars) document.body.style.setProperty(k,t.vars[k]);
 var m=document.querySelector('meta[name="theme-color"]');
 if(m) m.setAttribute("content",t.vars["--bg"]);
}
function save(){return dbSet(KEY,S).catch(function(){toast("저장하지 못했어요. 저장 공간이 꽉 찼을 수 있어요.")})}
function toast(msg){
 var old=document.querySelector(".toast"); if(old) old.remove();
 var d=el('<div class="toast">'+esc(msg)+'</div>');
 document.body.appendChild(d); setTimeout(function(){d.remove()},2300);
}
function worlds(){var o=[],seen={};S.characters.forEach(function(c){if(c.world&&!seen[c.world]){seen[c.world]=1;o.push(c.world)}});return o}

function filtered(){
 var k=q.trim().toLowerCase();
 var list=S.characters.filter(function(c){
  if(worldF!=="전체"&&c.world!==worldF) return false;
  if(!k) return true;
  var hay=[c.name,c.alias,c.world,c.summary,c.body,(c.tags||[]).join(" "),
   (c.fields||[]).map(function(f){return f.k+f.v}).join(" ")].join(" ").toLowerCase();
  return hay.indexOf(k)>-1;});
 if(sortBy==="name") list.sort(function(a,b){return a.name.localeCompare(b.name,"ko")});
 else if(sortBy==="world") list.sort(function(a,b){return (a.world||"힣").localeCompare(b.world||"힣","ko")});
 else list.sort(function(a,b){return b.made-a.made});
 return list;
}

/* ---------- 목록 ---------- */
function viewGrid(){
 applyTheme();
 app.innerHTML="";
 var t=THEMES[S.theme]||THEMES.peach;

 var head=el('<header class="top"></header>');
 var ti=el('<input class="title" spellcheck="false">');
 ti.value=S.title;
 ti.addEventListener("input",function(){S.title=ti.value;save()});
 var gear=el('<button class="icon" aria-label="설정 열기">⚙</button>');
 gear.addEventListener("click",openMenu);
 head.appendChild(ti);head.appendChild(gear);app.appendChild(head);

 var pal=el('<div class="palette"></div>');
 Object.keys(THEMES).forEach(function(k){
  var b=el('<button class="pdot'+(S.theme===k?" on":"")+'" aria-label="'+esc(THEMES[k].label)+'"></button>');
  b.style.background=THEMES[k].dot;
  b.addEventListener("click",function(){S.theme=k;save();viewGrid()});
  pal.appendChild(b);});
 pal.appendChild(el('<span class="pname">'+esc(t.label)+'</span>'));
 app.appendChild(pal);

 var tools=el('<div class="tools"></div>');
 var si=el('<input class="search" placeholder="이름, 태그, 설정 안에서 찾기">');
 si.value=q;
 si.addEventListener("input",function(){q=si.value;paintGrid()});
 var se=el('<select class="sel"><option value="new">최근 추가순</option><option value="name">이름순</option><option value="world">세계관순</option></select>');
 se.value=sortBy;
 se.addEventListener("change",function(){sortBy=se.value;paintGrid()});
 tools.appendChild(si);tools.appendChild(se);app.appendChild(tools);

 var chipbox=el('<div class="chips" id="chipbox"></div>');
 app.appendChild(chipbox);
 paintChips();

 app.appendChild(el('<div class="grid" id="grid"></div>'));
 app.appendChild(el('<p class="count" id="count"></p>'));

 var fab=el('<button class="fab" aria-label="캐릭터 추가">＋</button>');
 fab.addEventListener("click",function(){viewEdit(blank(),true)});
 app.appendChild(fab);

 paintGrid();
}
function paintChips(){
 var box=document.getElementById("chipbox"); if(!box) return;
 var ws=worlds(); box.innerHTML="";
 if(!ws.length) return;
 ["전체"].concat(ws).forEach(function(w){
  var b=el('<button class="chip'+(worldF===w?" on":"")+'">'+esc(w)+'</button>');
  b.addEventListener("click",function(){worldF=w;paintChips();paintGrid()});
  box.appendChild(b);});
}
function paintGrid(){
 var g=document.getElementById("grid"), c=document.getElementById("count");
 if(!g) return;
 g.innerHTML="";
 var list=filtered();
 if(!S.characters.length){
  var e=el('<div class="empty"><p class="e1">아직 도감이 비어 있어요.</p><p class="e2">첫 캐릭터를 올리면 여기에 카드로 쌓여요.</p></div>');
  var btn=el('<button class="cta">첫 캐릭터 추가하기</button>');
  btn.addEventListener("click",function(){viewEdit(blank(),true)});
  e.appendChild(btn); g.appendChild(e);
 } else if(!list.length){
  g.appendChild(el('<div class="empty"><p class="e2">찾는 캐릭터가 없어요. 다른 말로 찾아보세요.</p></div>'));
 } else {
  list.forEach(function(ch){
   var img=ch.image?'<img src="'+ch.image+'" alt="">'
    :'<span class="noimg" style="color:'+esc(ch.color)+';background:'+esc(ch.color)+'1a">'+esc((ch.name||"?").slice(0,1))+'</span>';
   var card=el('<button class="card">'+
    '<span class="spine" style="background:'+esc(ch.color)+'"></span>'+
    '<span class="thumb">'+img+'<span class="scrim"></span><span class="cname">'+esc(ch.name)+'</span></span>'+
    '<span class="cmeta">'+
     (ch.world?'<span class="cworld" style="color:'+esc(ch.color)+'">'+esc(ch.world)+'</span>':"")+
     (ch.summary?'<span class="csum">'+esc(ch.summary)+'</span>':"")+
    '</span></button>');
   card.addEventListener("click",function(){viewDetail(ch.id)});
   g.appendChild(card);});
 }
 if(c) c.textContent=S.characters.length+"명 · 약 "+fmt(new Blob([JSON.stringify(S)]).size);
}

/* ---------- 상세 ---------- */
function viewDetail(id){
 var ch=S.characters.filter(function(c){return c.id===id})[0];
 if(!ch) return viewGrid();
 applyTheme(); app.innerHTML="";
 var wrap=el('<div class="detail"></div>');
 wrap.style.setProperty("--me",ch.color);

 var bar=el('<div class="dbar"></div>');
 var back=el('<button class="icon" aria-label="목록으로">←</button>');
 back.addEventListener("click",viewGrid);
 var btns=el('<div class="dbtns"></div>');
 var ed=el('<button class="ghost">수정</button>');
 ed.addEventListener("click",function(){viewEdit(JSON.parse(JSON.stringify(ch)),false)});
 var del=el('<button class="ghost">삭제</button>');
 del.addEventListener("click",function(){askDelete(ch)});
 btns.appendChild(ed);btns.appendChild(del);
 bar.appendChild(back);bar.appendChild(btns);wrap.appendChild(bar);

 var shots=[ch.image].concat(ch.gallery||[]).filter(Boolean);
 var hero;
 if(shots.length){hero=el('<img class="hero" alt="'+esc(ch.name)+'">');hero.src=shots[0]}
 else{hero=el('<div class="hero noimg2">'+esc((ch.name||"?").slice(0,1))+'</div>');
  hero.style.color=ch.color;hero.style.background=ch.color+"14"}
 wrap.appendChild(hero);

 if(shots.length>1){
  var strip=el('<div class="strip"></div>');
  shots.forEach(function(s,i){
   var b=el('<button class="sthumb'+(i===0?" on":"")+'"><img src="'+s+'" alt=""></button>');
   b.addEventListener("click",function(){
    hero.src=s;
    strip.querySelectorAll(".sthumb").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on");});
   strip.appendChild(b);});
  wrap.appendChild(strip);
 }

 wrap.appendChild(el('<h1 class="dname">'+esc(ch.name)+'</h1>'));
 if(ch.alias) wrap.appendChild(el('<p class="dalias">'+esc(ch.alias)+'</p>'));
 if(ch.world) wrap.appendChild(el('<p class="dworld">'+esc(ch.world)+'</p>'));
 if(ch.summary) wrap.appendChild(el('<p class="dsum">'+esc(ch.summary)+'</p>'));
 if((ch.tags||[]).length)
  wrap.appendChild(el('<div class="tags">'+ch.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div>'));
 if((ch.fields||[]).length)
  wrap.appendChild(el('<dl class="sheetlist">'+ch.fields.map(function(f){
   return '<div class="frow"><dt>'+esc(f.k)+'</dt><dd>'+esc(f.v)+'</dd></div>'}).join("")+'</dl>'));
 if(ch.body) wrap.appendChild(el('<div class="body">'+esc(ch.body)+'</div>'));

 app.appendChild(wrap);
 window.scrollTo(0,0);
}

/* ---------- 편집 ---------- */
function viewEdit(d,isNew){
 applyTheme(); app.innerHTML="";
 var busy=false;
 var wrap=el('<div class="detail"></div>');

 var bar=el('<div class="dbar"></div>');
 var back=el('<button class="icon" aria-label="취소">←</button>');
 back.addEventListener("click",cancel);
 var btns=el('<div class="dbtns"></div>');
 var cn=el('<button class="ghost">취소</button>'); cn.addEventListener("click",cancel);
 var sv=el('<button class="save">'+(isNew?"추가하기":"저장하기")+'</button>');
 sv.addEventListener("click",submit);
 btns.appendChild(cn);btns.appendChild(sv);
 bar.appendChild(back);bar.appendChild(btns);wrap.appendChild(bar);

 var drop=el('<label class="drop"><span class="dropmsg">대표 이미지 고르기</span><input type="file" accept="image/*" class="hidden"></label>');
 var mainInput=drop.querySelector("input");
 function paintMain(){
  drop.innerHTML="";
  if(d.image){var i=el('<img alt="">');i.src=d.image;drop.appendChild(i)}
  else drop.appendChild(el('<span class="dropmsg">대표 이미지 고르기</span>'));
  drop.appendChild(mainInput);
 }
 mainInput.addEventListener("change",function(){
  var f=mainInput.files[0]; mainInput.value="";
  if(!f) return; setBusy(true);
  shrink(f).then(function(u){d.image=u;paintMain();setBusy(false)})
   .catch(function(){toast("이미지를 열지 못했어요.");setBusy(false)});});
 wrap.appendChild(drop);
 var clr=el('<button class="ghost small">대표 이미지 지우기</button>');
 clr.addEventListener("click",function(){d.image="";paintMain()});
 wrap.appendChild(clr);
 paintMain();

 var fg=el('<div class="fgrid"></div>');
 function field(label,ph,val){
  var l=el('<label class="fl"><span class="flabel">'+esc(label)+'</span><input class="in" placeholder="'+esc(ph)+'"></label>');
  l.querySelector("input").value=val||"";
  fg.appendChild(l); return l.querySelector("input");
 }
 var iName=field("이름","캐릭터 이름",d.name);
 var iAlias=field("이명 · 별명","예: 여명원의 마지막 신녀",d.alias);
 var iWorld=field("세계관 · 작품","같은 이름끼리 자동으로 묶여요",d.world);
 iWorld.setAttribute("list","wl");
 var dl=el('<datalist id="wl">'+worlds().map(function(w){return '<option value="'+esc(w)+'">'}).join("")+'</datalist>');
 fg.appendChild(dl);
 var iSum=field("한 줄 소개","카드에 같이 보여요",d.summary);
 var iTags=field("태그","쉼표로 나눠서: 다크로맨스, 챗봇, 서브남",(d.tags||[]).join(", "));
 wrap.appendChild(fg);

 wrap.appendChild(el('<div class="flabel">이 캐릭터의 색</div>'));
 var sw=el('<div class="sw"></div>');
 SWATCHES.forEach(function(c){
  var b=el('<button class="swdot'+(d.color===c?" on":"")+'" aria-label="색 '+esc(c)+'"></button>');
  b.style.background=c;
  b.addEventListener("click",function(){
   d.color=c;
   sw.querySelectorAll(".swdot").forEach(function(x){x.classList.remove("on")});
   b.classList.add("on");});
  sw.appendChild(b);});
 wrap.appendChild(sw);

 wrap.appendChild(el('<div class="flabel">항목</div>'));
 var rows=el('<div id="rows"></div>'); wrap.appendChild(rows);
 function addRow(k,v){
  var r=el('<div class="frow2"><input class="in k" placeholder="나이"><input class="in v" placeholder="19"><button class="x" aria-label="이 항목 지우기">×</button></div>');
  r.querySelector(".k").value=k||""; r.querySelector(".v").value=v||"";
  r.querySelector(".x").addEventListener("click",function(){r.remove()});
  rows.appendChild(r); return r;
 }
 (d.fields&&d.fields.length?d.fields:[{k:"",v:""}]).forEach(function(f){addRow(f.k,f.v)});
 var hintbox=el('<div class="chips"></div>');
 HINTS.concat(["직접 쓰기"]).forEach(function(h){
  var b=el('<button class="chip">+ '+esc(h)+'</button>');
  b.addEventListener("click",function(){
   var r=addRow(h==="직접 쓰기"?"":h,"");
   r.querySelector(h==="직접 쓰기"?".k":".v").focus();});
  hintbox.appendChild(b);});
 wrap.appendChild(hintbox);

 wrap.appendChild(el('<div class="flabel">설정 · 이야기</div>'));
 var ta=el('<textarea class="ta" placeholder="성격, 과거, 관계, 말버릇, 프롬프트… 길게 써도 괜찮아요."></textarea>');
 ta.value=d.body||""; wrap.appendChild(ta);

 wrap.appendChild(el('<div class="flabel">참고 이미지</div>'));
 var strip=el('<div class="strip"></div>');
 var moreInput=el('<input type="file" accept="image/*" multiple class="hidden">');
 function paintStrip(){
  strip.innerHTML="";
  (d.gallery||[]).forEach(function(g,i){
   var t=el('<div class="sthumb"><img alt=""><button class="gx" aria-label="지우기">×</button></div>');
   t.querySelector("img").src=g;
   t.querySelector(".gx").addEventListener("click",function(){d.gallery.splice(i,1);paintStrip()});
   strip.appendChild(t);});
  var add=el('<button class="addmore" aria-label="참고 이미지 추가">＋</button>');
  add.addEventListener("click",function(){moreInput.click()});
  strip.appendChild(add); strip.appendChild(moreInput);
 }
 moreInput.addEventListener("change",function(){
  var files=Array.prototype.slice.call(moreInput.files,0,6); moreInput.value="";
  if(!files.length) return; setBusy(true);
  Promise.all(files.map(function(f){return shrink(f,620,0.68)})).then(function(us){
   d.gallery=(d.gallery||[]).concat(us).slice(0,10); paintStrip(); setBusy(false);})
   .catch(function(){toast("이미지를 열지 못했어요.");setBusy(false)});});
 paintStrip(); wrap.appendChild(strip);

 var sv2=el('<button class="save wide">'+(isNew?"추가하기":"저장하기")+'</button>');
 sv2.addEventListener("click",submit); wrap.appendChild(sv2);

 function setBusy(b){busy=b;
  [sv,sv2].forEach(function(x){x.disabled=b;
   x.textContent=b?"이미지 넣는 중…":(isNew?"추가하기":"저장하기")});}
 function cancel(){isNew?viewGrid():viewDetail(d.id)}
 function submit(){
  if(busy) return;
  d.name=iName.value.trim()||"이름 없는 캐릭터";
  d.alias=iAlias.value.trim(); d.world=iWorld.value.trim(); d.summary=iSum.value.trim();
  d.tags=iTags.value.split(",").map(function(t){return t.trim()}).filter(Boolean);
  d.body=ta.value;
  d.fields=Array.prototype.map.call(rows.querySelectorAll(".frow2"),function(r){
   return {k:r.querySelector(".k").value.trim(),v:r.querySelector(".v").value.trim()}})
   .filter(function(f){return f.k||f.v});
  var idx=-1; S.characters.forEach(function(c,i){if(c.id===d.id) idx=i});
  if(idx>-1) S.characters[idx]=d; else S.characters.unshift(d);
  save().then(function(){toast(idx>-1?"수정했어요":"추가했어요");viewDetail(d.id)});
 }

 app.appendChild(wrap); window.scrollTo(0,0);
}

/* ---------- 시트 ---------- */
function sheet(inner){
 var w=el('<div class="sheetwrap"></div>');
 var s=el('<div class="sheet"></div>');
 s.appendChild(inner); w.appendChild(s);
 w.addEventListener("click",function(e){if(e.target===w) w.remove()});
 document.body.appendChild(w); return w;
}
function askDelete(ch){
 var box=el('<div><h3 class="sh">'+esc(ch.name)+'을(를) 지울까요?</h3>'+
  '<p class="note">이미지와 설정이 함께 사라지고 되돌릴 수 없어요.</p>'+
  '<div class="row2"><button class="btn keep">그대로 두기</button><button class="btn danger go">삭제하기</button></div></div>');
 var w=sheet(box);
 box.querySelector(".keep").addEventListener("click",function(){w.remove()});
 box.querySelector(".go").addEventListener("click",function(){
  S.characters=S.characters.filter(function(c){return c.id!==ch.id});
  save().then(function(){w.remove();viewGrid();toast("삭제했어요")});});
}
function openMenu(){
 var size=new Blob([JSON.stringify(S)]).size;
 var box=el('<div><h3 class="sh">보관과 백업</h3>'+
  '<p class="note">캐릭터는 이 브라우저 안에만 저장돼요. 인터넷에 올라가지 않으니 주소를 아는 사람이 들어와도 빈 도감만 보여요.<br>'+
  '지금 약 '+fmt(size)+' 쓰는 중 · '+S.characters.length+'명<br><br>'+
  '기기를 바꾸거나 브라우저 기록을 지우면 사라지니, 가끔 백업 파일을 내보내 두세요. 새 기기에서는 그 파일을 불러오면 그대로 옮겨져요.</p>'+
  '<div class="row2"><button class="btn out">백업 내보내기</button><button class="btn in2">백업 불러오기</button></div>'+
  '<p class="note" style="margin-top:14px">브라우저 공유 메뉴에서 “홈 화면에 추가”를 하면 앱처럼 열려요.</p>'+
  '<button class="btn wide close">닫기</button>'+
  '<input type="file" accept=".json,application/json" class="hidden imp"></div>');
 var w=sheet(box);
 box.querySelector(".close").addEventListener("click",function(){w.remove()});
 box.querySelector(".out").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download="도감백업-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},4000);
  toast("백업 파일을 내려받았어요");});
 var imp=box.querySelector(".imp");
 box.querySelector(".in2").addEventListener("click",function(){imp.click()});
 imp.addEventListener("change",function(){
  var f=imp.files[0]; imp.value=""; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(e){
   try{
    var inc=JSON.parse(e.target.result);
    if(!inc||!Array.isArray(inc.characters)) throw new Error("형식");
    var have={}; S.characters.forEach(function(c){have[c.id]=1});
    var add=inc.characters.map(function(c){if(have[c.id]) c.id=uid(); return c});
    S.characters=S.characters.concat(add);
    save().then(function(){w.remove();viewGrid();toast(add.length+"명을 더했어요")});
   }catch(err){toast("백업 파일을 읽지 못했어요. .json 파일인지 확인해 주세요.")}};
  fr.readAsText(f);});
}

/* ---------- 시작 ---------- */
dbGet(KEY).then(function(v){
 S=(v&&Array.isArray(v.characters))?v:{title:"내 캐릭터 도감",theme:"peach",characters:[]};
 if(!S.theme||!THEMES[S.theme]) S.theme="peach";
 viewGrid();
}).catch(function(){
 S={title:"내 캐릭터 도감",theme:"peach",characters:[]};
 viewGrid();
});
</script>
</body>
</html>
